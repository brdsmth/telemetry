name: app

on:
  push:
    paths: ["app/**", "schema/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "schema/**", ".github/workflows/app.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      # `npm run lint` currently fails on every file with
      # "typescript with invalid interface loaded as resolver" from
      # eslint-plugin-import; this predates the pipeline work. Re-enable once
      # the resolver config is fixed.
