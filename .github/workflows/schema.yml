name: schema

on:
  push:
    paths: ["schema/**", ".github/workflows/schema.yml"]
  pull_request:
    paths: ["schema/**", ".github/workflows/schema.yml"]

jobs:
  vectors:
    name: vectors are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 schema/tools/gen_vectors.py --check
