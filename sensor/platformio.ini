[platformio]
default_envs = esp32dev

; --- Firmware target ---------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_extra_dirs = ../lib
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001

; WiFi credentials from environment variables
build_flags = 
  -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
  -DWIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"

lib_deps =
  bblanchon/ArduinoJson@^6.21.2
  h2zero/NimBLE-Arduino@^1.4.1

; --- Host-side unit tests ----------------------------------------------------
; Builds only the hardware-independent sources so the math can be tested
; without a board:  pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<soil/soil_math.cpp>
build_flags = -std=c++17 -Isrc
